name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # fork 上 push 触发的运行可能一个都不跑（本项目 fork 历史运行数为 0），留一个手动入口好核对
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # BridgeTest 只依赖标准库（browser_bridge + http.server），可在无 GUI 环境运行
      - name: Run bridge unit tests
        run: python -m unittest test_browser_bridge.BridgeTest -v